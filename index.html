<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Lexend+Giga:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class = "menuScreen">
  <div id = "logo">
    <h2>X O</h2>
  </div>
  <div class = "menu">
    <h3>PICK PLAYER 1'S SIGN</h3>
    <div id = "choiceContainer">
      <button id = "choiceButton">X</button>
      <button id = "choiceButton">O</button>
    </div>
    <h2 id = "toRemember">Remember: X Goes First</h2>
  </div>
  <button id="startButton"> START GAME</button>
</div>
<div class = "game" style = "display: none;">
  <div id = "header">
    <div id = "logo">
    <h2>X O</h2>
  </div>
  <div id = "whoseTurn">X TURN</div>
  <div id = "restartButton">↻</div>
  </div>
  <div class = "cellContainer">
    <div class = "cell", id = "0"></div>
    <div class = "cell", id = "1"></div>
    <div class = "cell", id = "2"></div>
    <div class = "cell", id = "3"></div>
    <div class = "cell", id = "4"></div>
    <div class = "cell", id = "5"></div>
    <div class = "cell", id = "6"></div>
    <div class = "cell", id = "7"></div>
    <div class = "cell", id = "8"></div>
  </div>
  <div class = "winInfo">
    <div class = "smallContainer", id="playerXwins">
    <p id = "XwinsText"> PLAYER X</p>
    <p id = "XwinsQuantity">0</p>
  </div>
    <div class = "smallContainer", class = "ties">
      <p id = "tiesText"> TIES</p>
      <p id = "tieQuantity">0</p>
    </div>
    <div class = "smallContainer", id="playerOwins">
    <p id = "OwinsText"> PLAYER O</p>
    <p id = "OwinsQuantity">0</p>
    </div>
  </div>
</div>
</body>
</html>
